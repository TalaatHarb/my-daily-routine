apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-daily-routine-postgres-pv
  labels:
    type: local
    app: postgres
    app.kubernetes.io/part-of: my-daily-routine
spec:
  storageClassName: local-hostpath
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: my-daily-routine
    name: postgres-data-claim
  hostPath:
    path: /data/my-daily-routine/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-claim
  namespace: my-daily-routine
spec:
  storageClassName: local-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
