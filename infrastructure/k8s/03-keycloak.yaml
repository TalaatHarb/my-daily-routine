apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: my-daily-routine
data:
  realm-export.json: |
    {
      "realm": "my-daily-routine",
      "displayName": "My Daily Routine",
      "enabled": true,
      "registrationAllowed": true,
      "registrationEmailAsUsername": false,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "sslRequired": "external",
      "internationalizationEnabled": true,
      "supportedLocales": [
        "en",
        "ar"
      ],
      "defaultLocale": "en",
      "roles": {
        "realm": [
          {
            "name": "USER"
          },
          {
            "name": "ADMIN"
          }
        ]
      },
      "clients": [
        {
          "clientId": "my-daily-routine-web",
          "name": "My Daily Routine Web",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "redirectUris": [
            "https://mydailyroutine.talaatharb.net",
            "https://mydailyroutine.talaatharb.net/*"
          ],
          "webOrigins": [
            "https://mydailyroutine.talaatharb.net"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+"
          },
          "protocolMappers": [
            {
              "name": "my-daily-routine-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "my-daily-routine-web",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: my-daily-routine
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        # Keycloak shares the application database; make sure its schema exists even when
        # the Postgres volume was initialised before the init script was added.
        - name: ensure-keycloak-schema
          image: postgres:16
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres.my-daily-routine.svc.cluster.local -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
              psql -h postgres.my-daily-routine.svc.cluster.local -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS keycloak;'
          env:
            - name: PGDATABASE
              value: my_daily_routine
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_DB_USERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_DB_PASSWORD
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start
            - --http-enabled=true
            - --proxy-headers=xforwarded
            - --hostname=https://mydailyroutine-auth.talaatharb.net
            # Lets in-cluster callers (the API) fetch JWKS via the internal service URL.
            - --hostname-backchannel-dynamic=true
            - --import-realm
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres.my-daily-routine.svc.cluster.local
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: my_daily_routine
            - name: KC_DB_SCHEMA
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: my-daily-routine
  labels:
    app: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: keycloak
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: my-daily-routine
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mydailyroutine-auth.talaatharb.net
      secretName: mydailyroutine-auth-tls-secret
  rules:
    - host: mydailyroutine-auth.talaatharb.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
