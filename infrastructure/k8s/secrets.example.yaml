# Secret templates. Copy to infrastructure/k8s/secrets/secrets.yaml (git-ignored),
# replace every CHANGE_ME value and apply it before the other manifests.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: my-daily-routine
type: Opaque
stringData:
  POSTGRES_USER: my_daily_routine
  POSTGRES_PASSWORD: "CHANGE_ME_PASSWORD"
  POSTGRES_DB: my_daily_routine
  # .NET (Npgsql) connection string used by the API.
  CONNECTION_STRING: "Host=postgres.my-daily-routine.svc.cluster.local;Port=5432;Database=my_daily_routine;Username=my_daily_routine;Password=CHANGE_ME_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: my-daily-routine
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  KC_DB_USERNAME: my_daily_routine
  KC_DB_PASSWORD: "CHANGE_ME_PASSWORD"
