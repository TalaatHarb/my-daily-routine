apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: my-daily-routine
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/talaatharb/my-daily-routine/api:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: CONNECTION_STRING
            # Must match the token "iss" claim (public Keycloak URL).
            - name: Jwt__Authority
              value: https://mydailyroutine-auth.talaatharb.net/realms/my-daily-routine
            # Discovery/JWKS are fetched in-cluster to avoid hair-pinning through the ingress.
            - name: Jwt__MetadataAddress
              value: http://keycloak.my-daily-routine.svc.cluster.local:8080/realms/my-daily-routine/.well-known/openid-configuration
            - name: Jwt__Audience
              value: my-daily-routine-web
            # CORS is handled by the API only (the ingress adds no CORS headers).
            - name: Cors__AllowedOrigins
              value: https://mydailyroutine.talaatharb.net
            - name: Database__MigrateOnStartup
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: my-daily-routine
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: my-daily-routine
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # CORS is intentionally NOT enabled here: the API answers preflight requests and adds
    # Access-Control-* headers itself. Enabling both would produce duplicate headers.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mydailyroutine-api.talaatharb.net
      secretName: mydailyroutine-api-tls-secret
  rules:
    - host: mydailyroutine-api.talaatharb.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
