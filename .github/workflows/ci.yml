name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build apps/api/MyDailyRoutine.slnx -warnaserror

      - name: Test
        run: dotnet test apps/api/MyDailyRoutine.slnx --no-build

      - name: Check EF model has no pending migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project apps/api/src/MyDailyRoutine.Api --no-build

  web:
    name: Web lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run web:lint

      - name: Test
        run: npm run web:test

      - name: Build
        run: npm run web:build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
